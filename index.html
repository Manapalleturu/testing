<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAH Payment</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
.wrap{max-width:500px;margin:40px auto;padding:20px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;text-align:center;box-shadow:0 4px 18px #0001}
h1{margin-top:0}
.qr{display:block;width:280px;height:280px;max-width:100%;object-fit:contain;margin:20px auto;border:1px solid #ddd;border-radius:10px;cursor:pointer}
.pay{display:inline-block;text-decoration:none;background:#111;color:#fff;padding:13px 22px;border-radius:8px;font-weight:700}
.note{font-size:13px;color:#666;line-height:1.5}
.error{color:#b00020;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<section class="card">
<h1>Pay FAH</h1>
<div id="payment"><p class="note">Loading payment details...</p></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(async function(){
  const payment = document.getElementById("payment");

  try {
    const { data, error } = await supabaseClient
      .from("payment_settings")
      .select("upi_id,receiver_name,qr_image_url")
      .eq("active", true)
      .order("created_at", { ascending:false })
      .limit(1)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      payment.innerHTML =
        '<p class="error">Payment details are not configured yet.</p>';
      return;
    }

    const upiLink =
      "upi://pay?pa=" + encodeURIComponent(data.upi_id) +
      "&pn=" + encodeURIComponent(data.receiver_name || "FAH - Find All Happiness") +
      "&cu=INR";

    const qr = document.createElement("img");
    qr.className = "qr";
    qr.src = data.qr_image_url;
    qr.alt = "FAH Payment QR";

    const qrLink = document.createElement("a");
    qrLink.href = upiLink;
    qrLink.appendChild(qr);

    const payButton = document.createElement("a");
    payButton.className = "pay";
    payButton.href = upiLink;
    payButton.textContent = "Open UPI App";

    payment.innerHTML = "";
    payment.appendChild(qrLink);
    payment.appendChild(payButton);

    const note = document.createElement("p");
    note.className = "note";
    note.textContent =
      "Scan the QR code or tap the QR / button to open your UPI app. Enter the amount in your UPI app.";
    payment.appendChild(note);

  } catch (error) {
    console.error(error);
    payment.innerHTML =
      '<p class="error">Unable to load payment details.</p>' +
      '<p class="note">Please check the Supabase configuration.</p>';
  }
})();
</script>
</body>
</html>
