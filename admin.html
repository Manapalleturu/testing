<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAH Payment Admin</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#111}
.container{max-width:650px;margin:30px auto;padding:20px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;box-shadow:0 4px 18px #00000012}
h1{margin-top:0}
.field{margin:18px 0}
label{display:block;font-weight:700;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:#111;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.preview{text-align:center;margin:20px 0}
.preview img{max-width:260px;max-height:260px;border:1px solid #ddd;border-radius:10px}
.status{margin-top:15px;padding:12px;border-radius:8px;display:none}
.success{background:#e9f7e9;color:#176317}
.error{background:#ffe9e9;color:#a00000}
.note{font-size:13px;color:#666;line-height:1.5}
.current{border-top:1px solid #ddd;margin-top:25px;padding-top:20px}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>FAH Payment Management</h1>
<p class="note">Upload the QR image and enter the UPI ID that should be used by the customer payment link.</p>

<div class="field">
<label for="upi">UPI ID</label>
<input id="upi" placeholder="example@upi" autocomplete="off">
</div>

<div class="field">
<label for="receiver">Receiver Name</label>
<input id="receiver" value="FAH - Find All Happiness">
</div>

<div class="field">
<label for="qr">QR Image</label>
<input id="qr" type="file" accept="image/*">
</div>

<div class="preview" id="preview"></div>

<button id="save">Upload & Save Payment Details</button>

<div id="status" class="status"></div>

<div class="current">
<h3>Current Payment QR</h3>
<div id="current">Loading...</div>
</div>

<p class="note">
The customer page reads the latest active payment configuration from Supabase.
No payment amount is embedded in the UPI link.
</p>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const BUCKET = "fah-payment-qr";

const upiInput = document.getElementById("upi");
const receiverInput = document.getElementById("receiver");
const qrInput = document.getElementById("qr");
const preview = document.getElementById("preview");
const statusBox = document.getElementById("status");
const saveButton = document.getElementById("save");
const current = document.getElementById("current");

function status(message, type) {
  statusBox.textContent = message;
  statusBox.className = "status " + type;
  statusBox.style.display = "block";
}

qrInput.addEventListener("change", () => {
  const file = qrInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    preview.innerHTML = '<img src="' + e.target.result + '" alt="QR preview">';
  };
  reader.readAsDataURL(file);
});

async function loadCurrent() {
  const { data, error } = await supabaseClient
    .from("payment_settings")
    .select("upi_id,receiver_name,qr_image_url,created_at")
    .eq("active", true)
    .order("created_at", { ascending: false })
    .limit(1)
    .maybeSingle();

  if (error) {
    current.innerHTML = '<p class="error">Could not load current details: ' +
      escapeHtml(error.message) + '</p>';
    return;
  }

  if (!data) {
    current.innerHTML = '<p class="note">No payment configuration saved yet.</p>';
    return;
  }

  upiInput.value = data.upi_id || "";
  receiverInput.value = data.receiver_name || "FAH - Find All Happiness";

  current.innerHTML =
    '<p><b>UPI:</b> ' + escapeHtml(data.upi_id) + '</p>' +
    '<img src="' + escapeAttr(data.qr_image_url) +
    '" alt="Current QR" style="max-width:220px;border:1px solid #ddd;border-radius:10px">';
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function escapeAttr(value) {
  return String(value).replace(/"/g, "&quot;");
}

saveButton.addEventListener("click", async () => {
  const upi = upiInput.value.trim();
  const receiver = receiverInput.value.trim() || "FAH - Find All Happiness";
  const file = qrInput.files[0];

  if (!upi) {
    status("Please enter the UPI ID.", "error");
    return;
  }

  if (!file) {
    status("Please select the QR image.", "error");
    return;
  }

  saveButton.disabled = true;
  status("Uploading QR image...", "success");

  try {
    const extension = (file.name.split(".").pop() || "png").toLowerCase();
    const fileName = "payment-qr-" + Date.now() + "-" +
      Math.random().toString(36).slice(2) + "." + extension;

    const upload = await supabaseClient.storage
      .from(BUCKET)
      .upload(fileName, file, {
        cacheControl: "3600",
        upsert: false
      });

    if (upload.error) throw upload.error;

    const publicUrl = supabaseClient.storage
      .from(BUCKET)
      .getPublicUrl(fileName).data.publicUrl;

    // Deactivate existing configurations first.
    const deactivate = await supabaseClient
      .from("payment_settings")
      .update({ active: false })
      .eq("active", true);

    if (deactivate.error) throw deactivate.error;

    const insert = await supabaseClient
      .from("payment_settings")
      .insert({
        upi_id: upi,
        receiver_name: receiver,
        qr_image_url: publicUrl,
        active: true
      });

    if (insert.error) throw insert.error;

    status("Payment QR and UPI ID saved successfully.", "success");
    qrInput.value = "";
    preview.innerHTML = "";
    await loadCurrent();

  } catch (error) {
    console.error(error);
    status("Save failed: " + error.message, "error");
  } finally {
    saveButton.disabled = false;
  }
});

loadCurrent();
</script>
</body>
</html>
